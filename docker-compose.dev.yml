# Sólo para desarrollo local / paridad dev-prod (factor X).
# En producción, el repo orquestador es la fuente de verdad de la red y Traefik.
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-documents}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME}
    ports:
      # Sólo loopback: nunca publicar la BD en todas las interfaces.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u '${MONGO_INITDB_ROOT_USERNAME:-documents}' -p '${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME}' --authenticationDatabase admin --eval 'db.adminCommand("ping")'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-CHANGE_ME}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-CHANGE_ME}' ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  documents:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-documents}:${MONGO_INITDB_ROOT_PASSWORD:-CHANGE_ME}@mongodb:27017/?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME}@redis:6379/0
      # El servicio extract se entrega en otro repo del poly repo. Si corre en
      # la misma red docker, reemplazar por su nombre de servicio (p.ej. http://extract:8001).
      EXTRACT_SERVICE_URL: ${EXTRACT_SERVICE_URL:-http://host.docker.internal:8001}
      APP_LOG_LEVEL: INFO
      APP_LOG_FORMAT: json
      APP_DISABLE_DOTENV: "1"
      APP_DOCS_ENABLED: "false"
      APP_API_KEY: ${APP_API_KEY:-}
      APP_RATE_LIMIT_PER_MINUTE: ${APP_RATE_LIMIT_PER_MINUTE:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-8000}/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo-data:
