name: Build and publish image

# Factor V: build, release y run separados.
# Este workflow construye el artefacto y lo publica antes de que el repo
# orquestador lo ejecute. El orquestador debe consumir el digest inmutable.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag adicional opcional (ej. rc1)"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write # attestations de procedencia y SBOM

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR exige minúsculas; github.repository conserva la capitalización del owner.
  IMAGE_NAME: lautirebeco/pdf-documents-service
  # Debe coincidir con los ARG por defecto del Dockerfile.
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.13.9"

jobs:
  verify:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Instalar intérprete fijado
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sincronizar desde el lockfile
        run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Tests
        run: uv run --python ${{ env.PYTHON_VERSION }} pytest -q

  publish:
    name: Build y publicar imagen inmutable
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags y etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=pdf-documents-service
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - name: Build y push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            UV_VERSION=${{ env.UV_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Verificar que la imagen publicada arranca
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          docker run -d --name documents-release -p 18000:8000 \
            -e PORT=8000 \
            -e APP_LOG_LEVEL=WARNING \
            "$IMAGE_REF"

          healthy=0
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18000/health/live > /dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "::error::/health/live no respondió a tiempo"
            docker logs documents-release
            exit 1
          fi
          echo "Imagen publicada verificada: $IMAGE_REF"

      - name: Limpieza
        if: always()
        run: docker rm -f documents-release || true

      - name: Referencia para el orquestador
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          {
            echo "### Artefacto listo para el repo orquestador"
            echo
            echo "- Imagen inmutable: \`$IMAGE@$DIGEST\`"
            echo "- Tag inmutable alternativo: \`$IMAGE:sha-${{ github.sha }}\`"
            echo
            echo "Usar el digest en el compose del orquestador. \`main\` y \`latest\` son movibles."
          } >> "$GITHUB_STEP_SUMMARY"
